    <h1>Rclone Drive</h1>
    <p>Rclone Drive 是个人自用的 Google Drive 授权配置。它让运行在个人 Windows 电脑上的 rclone 将 Google Drive 挂载为一个盘符，以便在文件资源管理器中访问云盘文件。</p>
    <p>用户在 Google 授权页面选择账号并同意访问权限。本网页仅提供应用说明。</p>
